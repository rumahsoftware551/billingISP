client localhost_jaringanku {
    ipaddr = 127.0.0.1
    secret = "__RADIUS_SECRET__"
    require_message_authenticator = auto
}

# Requests generated by the Laravel app container for the built-in RADIUS test.
# The entrypoint resolves the current app container address at startup.
client docker_jaringanku {
    ipaddr = __DOCKER_CLIENT_NETWORK__
    secret = "__RADIUS_SECRET__"
    require_message_authenticator = auto
}
